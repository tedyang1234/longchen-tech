      <div class="logo">陇诚科技</div>

  <section>
    <div class="container">
      <div class="contact-form" id="inquiryForm">
        <h2>产品/合作咨询</h2>
        <input type="text" name="name" placeholder="姓名 *" required>
        <input type="tel" name="phone" placeholder="电话 *">
        <input type="email" name="email" placeholder="邮箱">
        <select name="type">
          <option value="">请选择咨询类型</option>
          <option value="高校合作">高校快检中心建设</option>
          <option value="行业合作">茶叶/腊肠行业合作</option>
          <option value="设备采购">快检设备与耗材</option>
          <option value="培训服务">技术培训与认证</option>
          <option value="其他">其他</option>
        </select>
        <textarea name="message" placeholder="请详细说明您的需求..."></textarea>
        <button type="submit">提交咨询</button>
      </div>

      <div style="text-align: center; margin-top: 40px;">
        <p><strong>公司地址：</strong>广东省广州市（具体地址可在此补充）</p>
        <p><strong>联系电话：</strong>020-XXXX XXXX</p>
        <p><strong>电子邮箱：</strong>info@longcheng-tech.com</p>
      </div>
    </div>
  </section>
